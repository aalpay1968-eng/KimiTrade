[workspace]
members = [
    "services/charting-engine",
    "services/market-data",
    "services/indicator-engine",
    "services/backtest-engine",
    "services/order-management",
    "services/user-service",
    "services/notification-service",
    "services/screener-service",
    "shared/types",
    "shared/utils",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Trading Platform Team"]
license = "MIT"
repository = "https://github.com/trading-platform/trading-platform"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-stream = "0.1"

# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression"] }
hyper = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Protocol Buffers
prost = "0.12"
prost-build = "0.12"
tonic = "0.11"
tonic-build = "0.11"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.22"
opentelemetry = "0.21"
opentelemetry-jaeger = "0.20"

# Metrics
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
influxdb = { version = "0.7", features = ["derive"] }

# Cache
dashmap = "5.5"
moka = { version = "0.12", features = ["future"] }

# Message Queue
rdkafka = { version = "0.36", features = ["cmake-build"] }
lapin = "2.3"

# WebSocket
tokio-tungstenite = "0.21"
futures = "0.3"

# HTTP Client
reqwest = { version = "0.11", features = ["json", "rustls-tls", "http2"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Validation
validator = { version = "0.16", features = ["derive"] }

# Authentication
jsonwebtoken = "9.2"
bcrypt = "0.15"
argon2 = "0.5"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Utilities
itertools = "0.12"
rayon = "1.8"
once_cell = "1.19"
parking_lot = "0.12"
crossbeam = "0.8"

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

# Math & Statistics
nalgebra = "0.32"
statrs = "0.16"
rand = "0.8"
rand_distr = "0.4"

# Testing
mockall = "0.12"
testcontainers = "0.15"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

# Shared crates
trading-types = { path = "shared/types" }
trading-utils = { path = "shared/utils" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 2
debug = true
